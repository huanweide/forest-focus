name: Build APK

# 说明：APK 不再 commit 进仓库。旧流程每次构建都把 2.3MB 的二进制文件
# git add 进 docs/download/，仓库体积只增不减；现改为发布到 GitHub Release。
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('twa-project/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Create keystore
        run: |
          keytool -genkey -v \
            -keystore forest-focus.keystore \
            -alias forestfocus \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASS }}" \
            -keypass "${{ secrets.KEYSTORE_PASS }}" \
            -dname "CN=Forest Focus, OU=Dev, O=HuanWei, L=Beijing, ST=Beijing, C=CN"

      - name: Install bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Initialize TWA
        run: |
          mkdir -p twa-project
          cd twa-project
          { printf "n\n%s\n" "$JAVA_HOME"; yes ""; } | bubblewrap init \
            --manifest "https://huanweide.github.io/forest-focus/manifest.json" \
            --directory .

      - name: Build APK
        working-directory: twa-project
        run: bubblewrap build

      - name: 收集 APK
        run: find twa-project -name "*.apk" -exec cp {} forest-focus.apk \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: forest-focus-apk
          path: forest-focus.apk

      - name: 发布到 GitHub Release
        # 旧做法把 APK 直接 commit 进仓库，每次构建都往 git 历史里塞二进制大文件。
        # 改为发布到 Release：仓库保持轻量，用户下载体验也更好。
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-${{ github.run_number }}
          name: 阿梓的森林 APK · #${{ github.run_number }}
          body: |
            由 Build APK workflow 自动打包（对应提交 ${{ github.sha }}）。

            安装前请先卸载旧版本：本 APK 使用 workflow 内临时生成的签名，
            与手工签名版本签名不一致，直接覆盖安装会失败。
          files: forest-focus.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
