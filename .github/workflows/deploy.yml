name: Deploy PWA to GitHub Pages

# 触发：push 到 main 且动了 PWA 相关源文件时，自动重新构建并部署
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'build.py'
      - 'manifest.json'
      - 'sw.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: write # 允许把构建产物推送到 gh-pages 分支

# 部署策略说明：
# GitHub REST API 无法把 Pages 源切到 "GitHub Actions" 方式（创建接口强制要求 branch 字段），
# 因此改用「gh-pages 分支 + legacy branch 源」方案：本 workflow 把内联打包后的 dist/ 推到
# gh-pages 分支，再用 gh api 把 Pages Source 设为 gh-pages 分支即可上线（已自动化处理）。

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # build.py 是纯标准库脚本：把 src/ 下的 CSS/JS 内联进 dist/index.html
      # 同时复制 manifest.json / sw.js / src/images / src/audio 到 dist/
      - name: Build PWA（内联打包 dist/index.html）
        run: python3 build.py

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
