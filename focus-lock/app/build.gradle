apply plugin: 'com.android.application'

android {
    namespace 'com.aziforest.focuslock'
    compileSdk 34

    defaultConfig {
        applicationId 'com.aziforest.focuslock'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 本原型使用原生 android.widget，无需 AndroidX / 第三方依赖
}
